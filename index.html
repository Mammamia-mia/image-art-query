<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>形象画数据查询</title>
  <style>
    :root {
      --bg: #f4f5f3;
      --surface: #ffffff;
      --surface-subtle: #f8f9f7;
      --line: #dfe3df;
      --line-strong: #c9cfca;
      --text: #202522;
      --muted: #667069;
      --accent: #176b5b;
      --accent-hover: #105446;
      --accent-soft: #e8f2ef;
      --warm: #b66d1f;
      --warm-soft: #fff3e5;
      --danger: #b33a3a;
      --shadow: 0 10px 28px rgba(31, 42, 35, 0.07);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    button, input, select { font: inherit; }

    button { cursor: pointer; }

    .app-shell { min-height: 100vh; }

    .topbar {
      height: 58px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      color: #fff;
      background: #242a27;
      border-bottom: 3px solid var(--warm);
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 6px;
      font-weight: 800;
      color: #f5c18d;
    }

    .topbar h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1;
      font-weight: 650;
    }

    .source-meta {
      margin-left: auto;
      color: #cfd5d1;
      font-size: 12px;
      white-space: nowrap;
    }

    main {
      width: min(100%, 1680px);
      margin: 0 auto;
      padding: 20px 24px 28px;
    }

    .toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
    }

    .toolbar-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

    .title-block h2 {
      margin: 0 0 5px;
      font-size: 22px;
      line-height: 1.3;
      font-weight: 680;
    }

    .title-block p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .button {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .button:hover { border-color: #9ea8a1; background: #fafbfa; }
    .button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(23, 107, 91, 0.18);
      outline-offset: 1px;
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .button.primary:hover { border-color: var(--accent-hover); background: var(--accent-hover); }
    .button:disabled { cursor: not-allowed; opacity: 0.55; }
    .button svg { width: 17px; height: 17px; stroke-width: 2; }
    .button:not(.primary) .spinner { border-color: #c8d5ce; border-top-color: var(--accent); }

    .filter-band {
      position: relative;
      z-index: 5;
      margin-bottom: 14px;
      padding: 16px;
      background: var(--surface);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 2px rgba(31, 42, 35, 0.03);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(160px, 1fr));
      gap: 12px 14px;
    }

    .field { min-width: 0; }

    .field label, .field-label {
      display: block;
      margin-bottom: 6px;
      color: #49534d;
      font-size: 12px;
      font-weight: 600;
    }

    .field input, .field select, .page-size select {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: #fff;
      color: var(--text);
    }

    .field input::placeholder { color: #9aa29d; }

    .input-wrap, .multi-select { position: relative; }
    .input-wrap input { padding-right: 34px; }

    .input-clear, .multi-clear {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
    }

    .input-clear:hover, .multi-clear:hover { background: #edf1ee; color: var(--text); }
    .input-clear[hidden], .multi-clear[hidden] { display: none; }
    .input-clear svg, .multi-clear svg { width: 15px; height: 15px; }

    .multi-trigger {
      width: 100%;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 10px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: #fff;
      color: var(--text);
      text-align: left;
    }

    .multi-trigger:hover { border-color: #9ea8a1; }
    .multi-trigger[aria-expanded="true"] { border-color: var(--accent); }
    .multi-trigger svg { width: 16px; height: 16px; flex: none; color: var(--muted); }
    .multi-value { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .multi-select.has-selection .multi-value { margin-right: 28px; }
    .multi-clear { right: 32px; z-index: 1; }

    .multi-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: max(100%, 260px);
      max-width: min(390px, calc(100vw - 32px));
      z-index: 10;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 14px 30px rgba(24, 38, 30, 0.16);
    }

    .multi-menu[hidden] { display: none; }
    .multi-menu.open-up { top: auto; bottom: calc(100% + 4px); }
    .multi-menu.align-right { left: auto; right: 0; }
    .multi-search-wrap { margin: 9px; }
    .multi-search-wrap input { height: 34px; padding-right: 34px; }
    .multi-options { max-height: 216px; overflow-y: auto; border-top: 1px solid var(--line); }
    .multi-option { display: flex; align-items: center; gap: 9px; padding: 7px 11px; cursor: pointer; }
    .multi-option:hover { background: var(--surface-subtle); }
    .multi-option input { width: 15px; height: 15px; flex: none; margin: 0; accent-color: var(--accent); }
    .multi-option span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .multi-select[data-key="门店名称"] .multi-option span { white-space: normal; overflow-wrap: anywhere; }
    .multi-empty { padding: 14px 11px; color: var(--muted); font-size: 12px; }
    .multi-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 11px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    .multi-footer button { padding: 3px 0; border: 0; background: none; color: var(--accent); }
    .multi-footer button:disabled { color: var(--muted); cursor: default; }

    .filter-actions {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      min-height: 59px;
    }

    .active-filters {
      display: none;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }

    .active-filters.visible { display: flex; max-height: 92px; overflow-y: auto; }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      padding: 4px 8px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: #155a4e;
      font-size: 12px;
    }

    .filter-chip strong { font-weight: 650; }
    .filter-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .data-panel {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: var(--shadow);
    }

    .panel-head {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-subtle);
    }

    .record-summary { color: var(--muted); font-size: 13px; }
    .record-summary strong { color: var(--text); font-weight: 680; }
    .table-wrap { overflow: auto; max-height: calc(100vh - 365px); min-height: 280px; }

    table {
      width: 100%;
      min-width: 1980px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      height: 42px;
      padding: 0 12px;
      color: #fff;
      background: #39423d;
      border-right: 1px solid rgba(255, 255, 255, 0.18);
      text-align: center;
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
    }

    thead th:last-child { border-right: 0; }

    tbody td {
      height: 42px;
      padding: 8px 12px;
      border-bottom: 1px solid #ecefec;
      color: #303733;
      vertical-align: middle;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    tbody tr:nth-child(even) td { background: #fbfcfb; }
    tbody tr:hover td { background: #f2f7f5; }
    td.numeric { text-align: right; font-variant-numeric: tabular-nums; }
    td.code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; color: #254b42; }

    th:nth-child(1) { width: 100px; }
    th:nth-child(2) { width: 90px; }
    th:nth-child(3) { width: 105px; }
    th:nth-child(4) { width: 220px; }
    th:nth-child(5) { width: 100px; }
    th:nth-child(6) { width: 115px; }
    th:nth-child(7) { width: 260px; }
    th:nth-child(8) { width: 135px; }
    th:nth-child(9) { width: 155px; }
    th:nth-child(10), th:nth-child(11) { width: 95px; }
    th:nth-child(12) { width: 290px; }
    th:nth-child(13) { width: 120px; }

    .empty-state td {
      height: 180px;
      text-align: center;
      color: var(--muted);
      background: #fff !important;
    }

    .pagination {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 14px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }

    .page-size { display: flex; align-items: center; gap: 8px; color: var(--muted); }
    .page-size select { width: 82px; height: 32px; padding: 0 7px; }

    .page-nav { display: flex; align-items: center; gap: 8px; }
    .page-nav .button { min-width: 34px; min-height: 32px; padding: 0 8px; }
    .page-nav .button svg { width: 16px; height: 16px; }
    .page-indicator { min-width: 94px; text-align: center; color: var(--muted); font-size: 13px; }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 20;
      max-width: min(380px, calc(100vw - 32px));
      padding: 11px 14px;
      border-radius: 6px;
      background: #242a27;
      color: #fff;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: var(--danger); }

    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1280px) {
      .filter-grid { grid-template-columns: repeat(4, minmax(160px, 1fr)); }
    }

    @media (max-width: 1120px) {
      .filter-grid { grid-template-columns: repeat(3, minmax(150px, 1fr)); }
      .table-wrap { max-height: calc(100vh - 420px); }
    }

    @media (max-width: 760px) {
      .topbar { height: auto; min-height: 58px; padding: 12px 16px; flex-wrap: wrap; }
      .source-meta { width: 100%; margin-left: 46px; margin-top: -8px; white-space: normal; }
      main { padding: 16px 12px 20px; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .toolbar-actions { width: 100%; }
      .toolbar-actions .button { flex: 1; }
      .filter-band { padding: 14px 12px; }
      .filter-grid { grid-template-columns: 1fr; }
      .filter-actions { min-height: auto; }
      .filter-actions .button { flex: 1; }
      .panel-head, .pagination { align-items: flex-start; flex-direction: column; }
      .panel-head { padding: 11px 12px; }
      .table-wrap { max-height: 54vh; }
      .pagination { align-items: stretch; }
      .page-size, .page-nav { justify-content: space-between; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">蕉</div>
      <h1>形象画数据查询</h1>
      <div class="source-meta">数据来源：形象画源数据.xlsx</div>
    </header>

    <main>
      <section class="toolbar" aria-labelledby="page-title">
        <div class="title-block">
          <h2 id="page-title">形象画明细</h2>
          <p id="dataset-meta">正在载入数据</p>
        </div>
        <div class="toolbar-actions">
          <button class="button" id="export-source-button" type="button">
            <i data-lucide="file-spreadsheet" aria-hidden="true"></i>
            <span>导出源数据</span>
          </button>
          <button class="button primary" id="export-button" type="button">
            <i data-lucide="download" aria-hidden="true"></i>
            <span>导出下单表</span>
          </button>
        </div>
      </section>

      <section class="filter-band" aria-label="数据筛选">
        <div class="filter-grid">
          <div class="field">
            <span class="field-label" id="label-region">区域</span>
            <div class="multi-select" id="filter-region" data-key="区域" data-placeholder="全部区域"></div>
          </div>
          <div class="field">
            <span class="field-label" id="label-manager">区经</span>
            <div class="multi-select" id="filter-manager" data-key="区经" data-placeholder="全部区经"></div>
          </div>
          <div class="field">
            <span class="field-label" id="label-province">省份</span>
            <div class="multi-select" id="filter-province" data-key="省份" data-placeholder="全部省份"></div>
          </div>
          <div class="field">
            <label for="filter-client">客户</label>
            <input id="filter-client" class="filter-text" data-key="客户" list="client-options" autocomplete="off" placeholder="输入或选择客户" />
            <datalist id="client-options"></datalist>
          </div>
          <div class="field">
            <label for="filter-store-code">门店编码</label>
            <input id="filter-store-code" class="filter-text" data-key="门店编码" list="store-code-options" autocomplete="off" placeholder="输入门店编码" />
            <datalist id="store-code-options"></datalist>
          </div>
          <div class="field">
            <span class="field-label" id="label-store-name">门店名称</span>
            <div class="multi-select" id="filter-store-name" data-key="门店名称" data-placeholder="全部门店"></div>
          </div>
          <div class="field">
            <span class="field-label" id="label-spec">道具规格编号</span>
            <div class="multi-select" id="filter-spec" data-key="道具规格编号" data-placeholder="全部规格"></div>
          </div>
          <div class="field">
            <span class="field-label" id="label-tool-name">道具名称</span>
            <div class="multi-select" id="filter-tool-name" data-key="道具名称" data-placeholder="全部道具"></div>
          </div>
          <div class="filter-actions">
            <button class="button primary" id="search-button" type="button">
              <i data-lucide="search" aria-hidden="true"></i>
              <span>查询</span>
            </button>
            <button class="button" id="reset-button" type="button">
              <i data-lucide="rotate-ccw" aria-hidden="true"></i>
              <span>重置</span>
            </button>
          </div>
        </div>
        <div class="active-filters" id="active-filters" aria-live="polite"></div>
      </section>

      <section class="data-panel" aria-label="形象画明细列表">
        <div class="panel-head">
          <div class="record-summary" id="record-summary"></div>
        </div>
        <div class="table-wrap" id="table-wrap">
          <table>
            <thead><tr id="table-head"></tr></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
        <div class="pagination">
          <div class="page-size">
            <label for="page-size">每页</label>
            <select id="page-size">
              <option value="20">20 条</option>
              <option value="50" selected>50 条</option>
              <option value="100">100 条</option>
              <option value="all">全部</option>
            </select>
          </div>
          <div class="page-nav">
            <button class="button" id="previous-page" type="button" aria-label="上一页" title="上一页">
              <i data-lucide="chevron-left" aria-hidden="true"></i>
            </button>
            <span class="page-indicator" id="page-indicator"></span>
            <button class="button" id="next-page" type="button" aria-label="下一页" title="下一页">
              <i data-lucide="chevron-right" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

          }
        });
        clearAll.addEventListener("click", function () { clear.click(); });
      }

      function initializeTextClear(input) {
        var wrap = document.createElement("div");
        wrap.className = "input-wrap";
        input.parentNode.insertBefore(wrap, input);
        wrap.appendChild(input);
        var clear = clearButton("清空" + input.dataset.key, "input-clear", function () {
          input.value = "";
          clear.hidden = true;
          applyFilters(false);
          input.focus();
        });
        clear.hidden = true;
        wrap.appendChild(clear);
        input.addEventListener("input", function () { clear.hidden = input.value.length === 0; });
      }

      function readFilters() {
        var nextFilters = {};
        multiSelects.forEach(function (control, key) {
          if (control.selected.size) nextFilters[key] = Array.from(control.selected);
        });
        document.querySelectorAll(".filter-text").forEach(function (control) {
          var value = control.value.trim();
          if (value) nextFilters[control.dataset.key] = value;
        });
        return nextFilters;
      }

      function filterRows(filters) {
        var entries = Object.entries(filters);
        if (!entries.length) return ROWS.slice();
        return ROWS.filter(function (row) {
          return entries.every(function (entry) {
            var key = entry[0];
            var actual = normalize(rowValue(row, key));
            if (Array.isArray(entry[1])) {
              return entry[1].some(function (value) { return actual === normalize(value); });
            }
            return actual.includes(normalize(entry[1]));
          });
        });
      }

      function renderActiveFilters() {
        var container = document.getElementById("active-filters");
        container.replaceChildren();
        var entries = Object.entries(state.filters);
        container.classList.toggle("visible", entries.length > 0);
        entries.forEach(function (entry) {
          (Array.isArray(entry[1]) ? entry[1] : [entry[1]]).forEach(function (selected) {
            var chip = document.createElement("span");
            chip.className = "filter-chip";
            var label = document.createElement("strong");
            label.textContent = FILTER_LABELS[entry[0]] + "：";
            var value = document.createElement("span");
            value.textContent = selected;
            chip.append(label, value);
            container.appendChild(chip);
          });
        });
      }

      function pageCount() {
        if (state.pageSize === "all") return 1;
        return Math.max(1, Math.ceil(state.filteredRows.length / state.pageSize));
      }

      function visibleRows() {
        if (state.pageSize === "all") return state.filteredRows;
        var start = (state.page - 1) * state.pageSize;
        return state.filteredRows.slice(start, start + state.pageSize);
      }

      function renderTable() {
        var body = document.getElementById("table-body");
        body.replaceChildren();
        var rows = visibleRows();
        if (!rows.length) {
          var emptyRow = document.createElement("tr");
          emptyRow.className = "empty-state";
          var emptyCell = document.createElement("td");
          emptyCell.colSpan = DISPLAY_HEADERS.length;
          emptyCell.textContent = "没有符合当前筛选条件的数据";
          emptyRow.appendChild(emptyCell);
          body.appendChild(emptyRow);
        } else {
          var fragment = document.createDocumentFragment();
          rows.forEach(function (row) {
            var tr = document.createElement("tr");
            DISPLAY_HEADERS.forEach(function (header) {
              var value = rowValue(row, header);
              var td = document.createElement("td");
              td.textContent = value === null || value === undefined ? "" : String(value);
              td.title = td.textContent;
              if (header === "宽（mm）" || header === "高（mm）") td.classList.add("numeric");
              if (header === "门店编码" || header === "道具规格编号") td.classList.add("code");
              tr.appendChild(td);
            });
            fragment.appendChild(tr);
          });
          body.appendChild(fragment);
        }

        var total = state.filteredRows.length;
        var startIndex = total ? (state.pageSize === "all" ? 1 : (state.page - 1) * state.pageSize + 1) : 0;
        var endIndex = total ? (state.pageSize === "all" ? total : Math.min(state.page * state.pageSize, total)) : 0;
        document.getElementById("record-summary").innerHTML = "当前 <strong>" + total + "</strong> 条，显示 " + startIndex + "-" + endIndex + " 条";
        document.getElementById("page-indicator").textContent = "第 " + state.page + " / " + pageCount() + " 页";
        document.getElementById("previous-page").disabled = state.page <= 1;
        document.getElementById("next-page").disabled = state.page >= pageCount();
        document.getElementById("export-button").disabled = total === 0;
        document.getElementById("export-source-button").disabled = total === 0;
      }

      function applyFilters(scrollToTop) {
        state.filters = readFilters();
        state.filteredRows = filterRows(state.filters);
        state.page = 1;
        renderActiveFilters();
        renderTable();
        if (scrollToTop) document.getElementById("table-wrap").scrollTo({ top: 0, behavior: "smooth" });
      }

      function resetFilters() {
        multiSelects.forEach(function (control) {
          control.selected.clear();
          control.search.value = "";
          control.searchClear.hidden = true;
          updateMultiControl(control);
          renderMultiOptions(control);
        });
        closeMultiMenus();
        document.querySelectorAll(".filter-text").forEach(function (control) {
          control.value = "";
          control.parentElement.querySelector(".input-clear").hidden = true;
        });
        applyFilters(true);
      }

      function showToast(message, isError) {
        var toast = document.getElementById("toast");
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.toggle("error", Boolean(isError));
        toast.classList.add("show");
        toastTimer = window.setTimeout(function () { toast.classList.remove("show"); }, 2600);
      }

      function base64ToArrayBuffer(base64) {
        var binary = atob(base64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        return bytes.buffer;
      }

      function formatTimestamp(date) {
        var pad = function (value) { return String(value).padStart(2, "0"); };
        return date.getFullYear() + pad(date.getMonth() + 1) + pad(date.getDate()) + "_" + pad(date.getHours()) + pad(date.getMinutes());
      }

      async function exportWorkbook() {
        applyFilters(false);
        if (!state.filteredRows.length) {
          showToast("当前没有可导出的数据", true);
          return;
        }

        var button = document.getElementById("export-button");
        var original = button.innerHTML;
        button.disabled = true;
        button.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>正在生成</span>';

        try {
          var zip = await JSZip.loadAsync(base64ToArrayBuffer(TEMPLATE_BASE64));
          var worksheetPath = "xl/worksheets/sheet1.xml";
          var documentText = await zip.file(worksheetPath).async("string");
          var xml = new DOMParser().parseFromString(documentText, "application/xml");
          if (xml.getElementsByTagName("parsererror").length) throw new Error("模板工作表结构无效");
          var namespace = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
          var sheetData = xml.getElementsByTagNameNS(namespace, "sheetData")[0];
          var dimension = xml.getElementsByTagNameNS(namespace, "dimension")[0];
          var exportHeaders = ["门店编码", "道具规格编号", "宽（mm）", "高（mm）", "规格说明-文本", "供应商"];
          state.filteredRows.forEach(function (sourceRow, index) {
            var rowNumber = index + 2;
            var row = xml.createElementNS(namespace, "row");
            row.setAttribute("r", String(rowNumber));
            exportHeaders.forEach(function (header, columnIndex) {
              var value = sourceRow[HEADER_INDEX[header]];
              var cell = xml.createElementNS(namespace, "c");
              cell.setAttribute("r", String.fromCharCode(65 + columnIndex) + rowNumber);
              if (value === null || value === undefined || value === "") {
                row.appendChild(cell);
                return;
              }
              if (typeof value === "number" && Number.isFinite(value)) {
                var numberValue = xml.createElementNS(namespace, "v");
                numberValue.textContent = String(value);
                cell.appendChild(numberValue);
              } else {
                cell.setAttribute("t", "inlineStr");
                var inline = xml.createElementNS(namespace, "is");
                var textValue = xml.createElementNS(namespace, "t");
                textValue.setAttributeNS("http://www.w3.org/XML/1998/namespace", "xml:space", "preserve");
                textValue.textContent = String(value);
                inline.appendChild(textValue);
                cell.appendChild(inline);
              }
              row.appendChild(cell);
            });
            sheetData.appendChild(row);
          });
          dimension.setAttribute("ref", "A1:F" + (state.filteredRows.length + 1));
          zip.file(worksheetPath, new XMLSerializer().serializeToString(xml), { createFolders: false });
          var buffer = await zip.generateAsync({ type: "uint8array", compression: "DEFLATE", compressionOptions: { level: 6 } });
          var blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
          var url = URL.createObjectURL(blob);
          var link = document.createElement("a");
          var scope = Object.keys(state.filters).length ? "筛选" : "全部";
          link.href = url;
          link.download = "形象画下单表_" + scope + "_" + state.filteredRows.length + "条_" + formatTimestamp(new Date()) + ".xlsx";
          document.body.appendChild(link);
          link.click();
          link.remove();
          window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          showToast("已导出 " + state.filteredRows.length + " 条数据");
        } catch (error) {
          console.error(error);
          showToast("导出失败，请重新打开页面后再试", true);
        } finally {
          button.innerHTML = original;
          button.disabled = state.filteredRows.length === 0;
          if (window.lucide) window.lucide.createIcons();
        }
      }

      async function exportSourceWorkbook() {
        applyFilters(false);
        if (!state.filteredRows.length) {
          showToast("当前没有可导出的数据", true);
          return;
        }

        var button = document.getElementById("export-source-button");
        var original = button.innerHTML;
        button.disabled = true;
        button.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>正在生成</span>';

        try {
          var namespace = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
          var xml = document.implementation.createDocument(namespace, "worksheet", null);
          var sheet = xml.documentElement;
          var dimension = xml.createElementNS(namespace, "dimension");
          dimension.setAttribute("ref", "A1:" + String.fromCharCode(64 + DISPLAY_HEADERS.length) + (state.filteredRows.length + 1));
          sheet.appendChild(dimension);
          var views = xml.createElementNS(namespace, "sheetViews");
          var view = xml.createElementNS(namespace, "sheetView");
          view.setAttribute("workbookViewId", "0");
          var pane = xml.createElementNS(namespace, "pane");
          pane.setAttribute("ySplit", "1");
          pane.setAttribute("topLeftCell", "A2");
          pane.setAttribute("activePane", "bottomLeft");
          pane.setAttribute("state", "frozen");
          view.appendChild(pane);
          views.appendChild(view);
          sheet.appendChild(views);

          var widths = [14, 12, 13, 30, 12, 15, 38, 22, 18, 14, 14, 50, 18];
          var columns = xml.createElementNS(namespace, "cols");
          widths.forEach(function (width, index) {
            var column = xml.createElementNS(namespace, "col");
            column.setAttribute("min", String(index + 1));
            column.setAttribute("max", String(index + 1));
            column.setAttribute("width", String(width));
            column.setAttribute("customWidth", "1");
            columns.appendChild(column);
          });
          sheet.appendChild(columns);

          var sheetData = xml.createElementNS(namespace, "sheetData");
          function addRow(values, rowNumber) {
            var row = xml.createElementNS(namespace, "row");
            row.setAttribute("r", String(rowNumber));
            values.forEach(function (value, index) {
              var cell = xml.createElementNS(namespace, "c");
              cell.setAttribute("r", String.fromCharCode(65 + index) + rowNumber);
              if (value !== null && value !== undefined) {
                if (typeof value === "number" && Number.isFinite(value)) {
                  var numberValue = xml.createElementNS(namespace, "v");
                  numberValue.textContent = String(value);
                  cell.appendChild(numberValue);
                } else {
                  cell.setAttribute("t", "inlineStr");
                  var inline = xml.createElementNS(namespace, "is");
                  var textValue = xml.createElementNS(namespace, "t");
                  textValue.textContent = String(value);
                  inline.appendChild(textValue);
                  cell.appendChild(inline);
                }
              }
              row.appendChild(cell);
            });
            sheetData.appendChild(row);
          }
          addRow(DISPLAY_HEADERS, 1);
          state.filteredRows.forEach(function (sourceRow, index) {
            addRow(DISPLAY_HEADERS.map(function (header) { return rowValue(sourceRow, header); }), index + 2);
          });
          sheet.appendChild(sheetData);
          var autoFilter = xml.createElementNS(namespace, "autoFilter");
          autoFilter.setAttribute("ref", dimension.getAttribute("ref"));
          sheet.appendChild(autoFilter);

          var zip = new JSZip();
          zip.file("[Content_Types].xml", '<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>');
          zip.file("_rels/.rels", '<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
          zip.file("xl/workbook.xml", '<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="形象画源数据" sheetId="1" r:id="rId1"/></sheets></workbook>');
          zip.file("xl/_rels/workbook.xml.rels", '<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>');
          zip.file("xl/worksheets/sheet1.xml", new XMLSerializer().serializeToString(xml));

          var buffer = await zip.generateAsync({ type: "uint8array", compression: "DEFLATE", compressionOptions: { level: 6 } });
          var blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
          var url = URL.createObjectURL(blob);
          var link = document.createElement("a");
          link.href = url;
          link.download = "形象画源数据_" + (Object.keys(state.filters).length ? "筛选" : "全部") + "_" + state.filteredRows.length + "条_" + formatTimestamp(new Date()) + ".xlsx";
          document.body.appendChild(link);
          link.click();
          link.remove();
          window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          showToast("已导出 " + state.filteredRows.length + " 条源数据");
        } catch (error) {
          console.error(error);
          showToast("导出失败，请重新打开页面后再试", true);
        } finally {
          button.innerHTML = original;
          button.disabled = state.filteredRows.length === 0;
          if (window.lucide) window.lucide.createIcons();
        }
      }

      function initialize() {
        document.querySelectorAll(".multi-select").forEach(initializeMultiSelect);
        document.querySelectorAll(".filter-text").forEach(initializeTextClear);
        fillDatalist("client-options", "客户");
        fillDatalist("store-code-options", "门店编码");

        var tableHead = document.getElementById("table-head");
        DISPLAY_HEADERS.forEach(function (header) {
          var th = document.createElement("th");
          th.scope = "col";
          th.textContent = header;
          tableHead.appendChild(th);
        });

        document.getElementById("dataset-meta").textContent = "共 " + ROWS.length + " 条记录，" + DISPLAY_HEADERS.length + " 个字段";
        document.getElementById("search-button").addEventListener("click", function () { applyFilters(true); });
        document.getElementById("reset-button").addEventListener("click", resetFilters);
        document.getElementById("export-button").addEventListener("click", exportWorkbook);
        document.getElementById("export-source-button").addEventListener("click", exportSourceWorkbook);
        document.getElementById("previous-page").addEventListener("click", function () {
          if (state.page > 1) { state.page -= 1; renderTable(); document.getElementById("table-wrap").scrollTop = 0; }
        });
        document.getElementById("next-page").addEventListener("click", function () {
          if (state.page < pageCount()) { state.page += 1; renderTable(); document.getElementById("table-wrap").scrollTop = 0; }
        });
        document.getElementById("page-size").addEventListener("change", function (event) {
          state.pageSize = event.target.value === "all" ? "all" : Number(event.target.value);
          state.page = 1;
          renderTable();
        });
        document.querySelectorAll(".filter-text").forEach(function (control) {
          control.addEventListener("keydown", function (event) {
            if (event.key === "Enter") applyFilters(true);
          });
        });
        document.addEventListener("pointerdown", function (event) {
          if (!event.target.closest(".multi-select")) closeMultiMenus();
        });
        document.addEventListener("keydown", function (event) {
          if (event.key !== "Escape") return;
          var open = Array.from(multiSelects.values()).find(function (control) { return !control.menu.hidden; });
          if (open) { closeMultiMenus(); open.trigger.focus(); }
        });

        renderTable();
        if (window.lucide) window.lucide.createIcons();
      }

      initialize();
    })();
  </script>
</body>
</html>
